name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run regression tests
        env:
          MAK2_RANDOM_SEED: "42"
        run: pytest tests/regression/ -v

  lint:
    # Lint warns but does not block merge — the engine has cosmetic
    # issues (f-strings without placeholders in __main__ blocks, etc.)
    # that are tracked but not fixed in Phase 0.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint check
        run: ruff check .
