name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run regression tests
        env:
          MAK2_RANDOM_SEED: "42"
          # Tolerance mode allows bounded floating-point drift between
          # the platform where the reference fixture was captured (macOS)
          # and the CI runner (Linux). Different BLAS/LAPACK builds and
          # SIMD paths produce relative differences of ~1e-8 in fitted
          # D0/Ct/R². Tolerance mode caps drift at D0 ±5%, R² ±0.001,
          # Ct ±0.1 cycles, and still requires exact Status match. Local
          # developers can run with exact-equality mode (omit this var)
          # to catch intra-platform regressions.
          REGRESSION_TOLERANCE_MODE: "1"
        run: pytest tests/regression/ -v

  lint:
    # Lint warns but does not block merge — the engine has cosmetic
    # issues (f-strings without placeholders in __main__ blocks, etc.)
    # that are tracked but not fixed in Phase 0.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint check
        run: ruff check .
